server.port=0

# 遥测规则参数（默认值；可在此覆盖）
# 滑动窗口长度（毫秒）
telemetry.window-millis=60000
# 允许的最大迟到时长（相对事件时间水位，毫秒）：eventTime < watermark - maxLateMillis 拒绝
telemetry.max-late-millis=10000
# 离线判定阈值（毫秒）：now - 最后有效上报时间 <= 阈值 视为在线
telemetry.offline-threshold-millis=30000
# 每设备保留的拒绝留档条数上限（超出淘汰最旧记录）
telemetry.rejected-history-per-device=200
